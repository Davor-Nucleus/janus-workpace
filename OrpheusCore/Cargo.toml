[package]
name = "OrpheusCore"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
winapi = { version = "0.3", features = ["wincon", "winuser", "libloaderapi", "commctrl", "wingdi"] }
warp = "0.3"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
janus_nucleus = { path = "../janus_nucleus", features = ["stream", "http"] }

[build-dependencies]
winres = "0.1"
