[package]
name = "janus_nucleus"
version = "0.1.0"
edition = "2021"

# `stream` tire LAME, qui se compile depuis ses sources C. JanusCore et PhonosCore
# n'en ont pas besoin : ils sortent sur la carte son. La feature leur évite ce coût
# lors d'un `cargo build` lancé depuis leur propre dossier.
#
# À noter : un `cargo build --workspace` unifie les features, donc LAME sera compilé
# dès que WebRadioCore fait partie de la construction. Le code inutilisé est écarté
# au link.
[features]
default = []
stream = ["dep:mp3lame-encoder", "dep:tokio", "dep:tokio-stream", "dep:bytes"]
# Lecture des tags et de la pochette. Sortie ici pour que JanusCore et
# WebRadioCore partagent `sanitize_cover_mime` : c'est un contrôle de sécurité, et
# une seconde copie finirait par diverger de la première.
metadata = ["dep:symphonia", "dep:base64"]
# Découverte des playlists sur disque. PhonosCore n'en a pas besoin : son
# soundboard est un dossier plat, sans notion de playlist.
music = ["dep:walkdir", "dep:rand"]
# Réponse HTTP d'un flux continu. Séparée de `stream` pour que qui ne veut que le
# cadenceur ou l'encodeur n'ait pas à tirer warp.
http = ["stream", "dep:warp"]

[dependencies]
winapi = { version = "0.3", features = ["wincon", "winuser", "libloaderapi", "commctrl", "wingdi"] }
widestring = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ebur128 = "0.1"
rodio = "0.17"

mp3lame-encoder = { version = "0.2", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
bytes = { version = "1", optional = true }
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "aac", "isomp4"], optional = true }
base64 = { version = "0.21", optional = true }
walkdir = { version = "2.4", optional = true }
rand = { version = "0.8", optional = true }
warp = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
