[package]
name = "janus_logwindow_nucleus"
version = "0.1.0"
edition = "2021"

# Capacite « fenetre de logs ». C'est la seule brique qui tire le gros jeu de
# features winapi : un enfant headless ne la declare pas et ne les compile pas.
[dependencies]
winapi = { version = "0.3", features = ["wincon", "winuser", "libloaderapi", "commctrl", "wingdi"] }
widestring = "1"
janus_log_nucleus = { path = "../janus_log_nucleus" }
